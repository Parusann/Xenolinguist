name: Deploy public site to Pages

on:
  # Deploy from main (the protected Pages environment) while the reviewed
  # application source remains on the implementation branch.
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full reviewed implementation commit SHA to build and publish'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require an immutable source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Record deployed source
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:public
      - name: SPA fallback (404 = index)
        run: cp test-results/public-site/index.html test-results/public-site/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: test-results/public-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
